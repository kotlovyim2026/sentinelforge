services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: postgres
            POSTGRES_DB: secops
        ports: ["5432:5432"]
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7
        ports: ["6379:6379"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    rabbitmq:
        image: rabbitmq:3-management
        ports:
            - "5672:5672"
            - "15672:15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 10s
            retries: 5

    gateway:
        build: ./apps/sf-gateway
        ports: ["3001:3001"]
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        environment:
            PORT: 3001
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/secops
            REDIS_URL: redis://redis:6379
            RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
            AI_SERVICE_URL: http://ai-service:8002
            ORCHESTRATOR_URL: http://orchestrator:8001
            INTEGRATIONS_URL: http://integrations:3002
        env_file: .env

    integrations:
        build: ./apps/sf-integrations
        ports: ["3002:3002"]
        depends_on:
            rabbitmq:
                condition: service_healthy
        env_file: .env

    orchestrator:
        build: ./apps/sf-orchestrator
        ports: ["8001:8001"]
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        environment:
            PORT: 8001
        env_file: .env

    ai-service:
        build: ./apps/sf-ai
        ports: ["8002:8002"]
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        environment:
            PORT: 8002
        env_file: .env

    web:
        build: ./apps/sf-web
        ports: ["3000:3000"]
        depends_on: [gateway]
        env_file: .env

volumes:
    pgdata:
